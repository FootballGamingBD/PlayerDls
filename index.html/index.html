<!DOCTYPE html>
<html>
<head>
<style>
.card{
  position:relative;
  width:300px;
  height:420px;
  margin:auto;
}
.card img{
  position:absolute;
}

/* Layer positions */
.bg{ width:100%; left:0; top:0; }
.player{ width:180px; left:60px; top:70px; }
.border{ width:100%; left:0; top:0; }
.rating{ width:55px; left:20px; top:20px; }
.position{ width:45px; left:20px; top:90px; }
.year{ width:55px; right:20px; top:20px; }

.name{
 position:absolute;
 bottom:20px;
 width:100%;
 text-align:center;
 color:white;
 font-size:24px;
 font-weight:bold;
}
</style>
</head>
<body>

<div class="card">

  <img class="bg"
   src="Assets/CardBG/your-bg.png">

  <img class="player"
   src="Assets/Players/25841.webp">

  <img class="border"
   src="Assets/Cardborder/your-border.png">

  <img class="rating"
   src="Assets/rating circle/89.png">

  <img class="position"
   src="Assets/Positionbox/RW.png">

  <img class="year"
   src="Assets/Yearbox/2026.png">

  <div class="name">MESSI</div>

</div>

</body>
</html>
